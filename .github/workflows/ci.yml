# Integracion continua.
#
# Todo lo que hasta ahora se verificaba a mano en tu maquina, aqui lo hace una
# maquina limpia en cada Pull Request. "En mi maquina funciona" deja de ser una
# frase valida: si no pasa aqui, no entra en main.
#
# Dos jobs, en cadena:
#   calidad -> lint y tests unitarios. Segundos. Falla rapido y barato.
#   imagen  -> build, escaneo de vulnerabilidades, prueba end-to-end contra
#              Postgres de verdad y publicacion en GHCR. Minutos.
#
# El orden importa: no tiene sentido construir una imagen de 300 MB para
# descubrir despues que faltaba un import.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo sobre la misma rama cancela el run anterior: nadie necesita el
# resultado de un commit que ya esta obsoleto, y los runners no son gratis.
# En main NO se cancela (github.ref en el grupo lo separa por rama, y main solo
# recibe merges, que no se pisan entre si).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos minimos por defecto. Cada job pide lo que necesita de mas.
# El GITHUB_TOKEN por defecto en repos antiguos venia con permisos de escritura
# sobre todo; declararlo explicitamente es lo que evita que un action
# comprometido pueda escribir en el repositorio.
permissions:
  contents: read

jobs:
  # ===========================================================================
  # calidad - lint + tests unitarios
  # ===========================================================================
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv no publica tag mayor flotante (@v10 no existe), asi
      # que aqui va la version exacta. Es lo que hacen el resto de actions con
      # su @vN, solo que sin el alias que lo hace comodo.
      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Version fija, igual que en el Dockerfile: el CI tiene que usar las
          # mismas herramientas que la imagen que publica.
          version: "0.11.6"
          enable-cache: true

      # --locked: falla si uv.lock no cuadra con pyproject.toml. Es la version
      # automatizada de "commitea el lockfile": si alguien anade una dependencia
      # y olvida el lock, se entera aqui y no en produccion.
      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      # Renderizar el overlay no despliega nada, pero falla si el YAML esta roto,
      # si un parche apunta a un recurso que no existe o si una referencia se
      # quedo colgada. Son los errores que si no, se descubren con el cluster
      # delante. kubectl viene preinstalado en el runner.
      - name: Validar manifiestos de Kubernetes
        run: kubectl kustomize k8s/overlays/dev > /dev/null

  # ===========================================================================
  # imagen - build, escaneo, prueba end-to-end y publicacion
  # ===========================================================================
  imagen:
    needs: calidad
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # solo este job publica en GHCR
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Calcula los tags a partir del evento. La clave es type=sha: un tag
      # INMUTABLE por commit. `latest` sirve para probar a mano, pero desplegar
      # `latest` significa no saber que version corre en el cluster; en la Fase 6
      # Argo CD apuntara al tag sha.
      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # load: true deja la imagen en el daemon local para poder escanearla y
      # probarla ANTES de publicarla. Publicar primero y verificar despues es
      # publicar una imagen rota.
      # linkshort:ci es un tag local extra, el que usa Compose mas abajo.
      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          # Sin esto, la capa FROM se sirve de la cache indefinidamente: el
          # escaneo saldria verde durante meses sobre una imagen base vieja,
          # que es justo la vulnerabilidad que se pretende detectar.
          pull: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            linkshort:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed: true -> no falla por CVEs que todavia no tienen parche.
      # Sin esto el CI se pone rojo por vulnerabilidades que nadie puede
      # arreglar, y un CI que siempre esta rojo es un CI que nadie mira.
      - name: Escanear vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: linkshort:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Los tests del job anterior corren contra SQLite en memoria: son rapidos
      # pero no ven nada especifico de Postgres. Aqui se levanta el stack real
      # -- Postgres, migraciones Alembic y la imagen recien construida -- y se
      # comprueba el camino completo. --no-build es lo que garantiza que se
      # prueba EL artefacto que se va a publicar, no una recompilacion parecida.
      - name: Levantar el stack
        env:
          IMAGE: linkshort:ci
        run: docker compose up -d --no-build --wait api

      - name: Prueba end-to-end
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/ready

          slug=$(curl -fsS -X POST http://localhost:8000/links \
            -H 'content-type: application/json' \
            -d '{"url":"https://example.com/"}' | jq -r .slug)

          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000/$slug")
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' "http://localhost:8000/$slug")

          test "$code" = "307"
          test "$loc" = "https://example.com/"
          echo "OK: $slug -> $loc"

      # Sin esto, un fallo del paso anterior deja como unica pista "exit code 1".
      # Los logs de la migracion y de la API son donde esta el motivo real.
      - name: Logs (solo si algo falla)
        if: failure()
        run: docker compose logs --no-color

      - name: Tirar el stack
        if: always()
        run: docker compose down -v

      # Publicar solo desde main. Una rama de trabajo no tiene por que dejar
      # imagenes en el registro: son ruido y ocupan espacio.
      - name: Login en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No es un secreto que haya que crear: el token lo emite GitHub para
          # este run y caduca al terminar. Un PAT de larga vida en un secreto
          # del repo seria justo lo contrario.
          password: ${{ secrets.GITHUB_TOKEN }}

      # La imagen ya esta construida y verificada en el daemon: aqui solo se
      # suben los tags. No se vuelve a construir nada.
      - name: Publicar
        if: github.event_name == 'push'
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -n1 docker push
