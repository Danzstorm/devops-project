[project]
name = "linkshort"
version = "0.1.0"
description = "Acortador de URLs - proyecto DevOps end-to-end"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

# --- Herramientas ---
# Todo en pyproject.toml a proposito: una sola fuente de configuracion en vez
# de un setup.cfg, un .flake8, un pytest.ini y un .isort.cfg peleandose.

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff format tambien formatea los bloques ```python de los .md, y los ejemplos
# de docs/ estan mal escritos A PROPOSITO (muestran el error, no la solucion).
exclude = ["docs"]

[tool.ruff.lint]
# E/F: errores y estilo base.  I: ordena los imports.
# UP: moderniza sintaxis obsoleta.  B: bugs sutiles (bugbear).
# S: seguridad (bandit). Anadida en la Fase 8, como se prometio en la Fase 1.
#    Detecta cosas como random en vez de secrets, subprocess con shell=True,
#    asserts usados como validacion, o binds a 0.0.0.0 sin querer.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: los tests USAN assert, es su forma de trabajar. La regla existe porque
# un assert en codigo de produccion desaparece al ejecutar con -O, y una
# validacion que se evapora segun como arranques el proceso es peor que no
# tenerla. En un test no hay -O ni produccion.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
