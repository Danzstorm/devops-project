# Cluster local de kind.
#
# "Si no esta en el repo, no existe" tambien aplica al cluster: crearlo con
# `kind create cluster` a secas funciona, pero entonces la topologia vive en la
# memoria de quien lo hizo. Aqui esta escrita.
#
#   kind create cluster --config k8s/kind-cluster.yaml
#   kind delete cluster --name linkshort
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: linkshort

nodes:
  - role: control-plane
    # kind corre los nodos como contenedores de Docker, asi que el puerto de un
    # NodePort no es alcanzable desde el host a menos que se mapee aqui. Es el
    # equivalente del `ports:` de docker-compose, y hay que declararlo al CREAR
    # el cluster: no se puede anadir despues sin recrearlo.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000
        protocol: TCP

# Un solo nodo a proposito. Anadir workers en un cluster local no ensena nada
# que un solo nodo no ensene ya, y multiplica la RAM que consume. Los conceptos
# que si dependen de varios nodos (anti-afinidad, drain, topology spread) llegan
# cuando haya un cluster de verdad donde signifiquen algo.
