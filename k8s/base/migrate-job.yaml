# Migraciones como Job: el equivalente exacto del servicio `migrate` de
# docker-compose. Misma imagen, otro comando, un solo uso.
#
# Por que NO va dentro del arranque de la app (ni como initContainer): con 2
# replicas serian 2 procesos aplicando el mismo esquema a la vez. Alembic toma
# un lock, asi que no corrompe nada, pero el segundo pod se queda esperando y
# el despliegue se vuelve lento y confuso. Un Job es un actor unico y explicito.
apiVersion: batch/v1
kind: Job
metadata:
  name: linkshort-migrate
  annotations:
    # Fase 6: aqui se salda la deuda que dejo la Fase 4.
    #
    # hook: Sync -- y NO PreSync, que fue el primer intento y se quedo colgado:
    #
    #   Running: waiting for completion of hook batch/Job/linkshort-migrate
    #
    # PreSync se ejecuta antes de sincronizar NADA, incluido Postgres. La
    # migracion esperaba una base de datos que la propia sincronizacion tenia
    # bloqueada. Un abrazo mortal perfecto.
    #
    # Con hook Sync el Job participa en la fase de sincronizacion normal y
    # respeta las sync-waves, asi que el orden se declara en vez de asumirse:
    #
    #   wave -1  Postgres
    #   wave  0  esta migracion  <- Argo espera a que termine bien
    #   wave  1  la API
    #
    # Y la garantia importante se mantiene: si la migracion falla, la
    # sincronizacion se detiene y la version nueva de la app no llega a
    # desplegarse. `kubectl apply -k` no daba eso -- alli el Job y el Deployment
    # se creaban a la vez y el orden dependia de la suerte.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    # BeforeHookCreation -> borra el Job anterior antes de crear el nuevo.
    #
    # Es exactamente el arreglo del "field is immutable" de la Fase 4: spec.template
    # de un Job no se puede modificar, asi que al cambiar de imagen habia que
    # borrarlo a mano. Argo CD lo hace por su cuenta en cada sincronizacion.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Se autodestruye 5 minutos despues de terminar. Sin esto, los Jobs completados
  # se acumulan en el namespace para siempre.
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    spec:
      # OnFailure + backoffLimit es lo que sustituye al `depends_on:
      # service_healthy` de Compose. Kubernetes no tiene orden de arranque: si
      # Postgres todavia no acepta conexiones, el Job falla, espera y reintenta
      # con backoff exponencial. Un initContainer con un bucle de `pg_isready`
      # haria lo mismo con mas YAML.
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: ghcr.io/danzstorm/devops-project
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: linkshort-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
